name: ExpenseIt CI (Contracts + Backend + Mobile)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-and-contracts:
    name: Backend Tests & Contract Conformance (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint backend with Ruff
        run: ruff check app tests

      - name: Run Contract, RBAC/SoD & Stub Tests
        run: pytest -v

  mobile-typecheck-and-codegen:
    name: Expo Mobile Typecheck & OpenAPI Drift Gate (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenAPI TypeScript Codegen is Up-to-Date
        run: |
          npm run codegen
          git diff --exit-code src/api/generated.ts

      - name: Run TypeScript Compiler Check
        run: npm run typecheck

