                  $ref: "#/components/schemas/NotificationItem"

  /api/v1/notifications/{notification_id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationItem"

  /api/v1/devices/push-token:
    post:
      tags: [Notifications]
