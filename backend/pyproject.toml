[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expenseit-backend"
version = "0.1.0"
description = "ExpenseIt FastAPI Backend & Phase 0 Stateful Contract Stubs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "alembic>=1.13.3,<2.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "pwdlib[argon2]>=0.2.1,<1.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "Pillow>=10.4.0,<12.0.0",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
